<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Roshan Yadav | Python Developer & Data Scientist</title>
    <meta name="description" content="Portfolio of Roshan Yadav - Data Science, AI, and Web Development" />
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['Outfit', 'sans-serif'],
            },
            colors: {
              brand: {
                dark: '#0B0A14',
                purple: '#2D274B',
                accent: '#9787F4',
                light: '#E0DEEE'
              }
            },
            animation: {
              'blob': 'blob 7s infinite',
              'float': 'float 6s ease-in-out infinite',
            },
            keyframes: {
              blob: {
                '0%': { transform: 'translate(0px, 0px) scale(1)' },
                '33%': { transform: 'translate(30px, -50px) scale(1.1)' },
                '66%': { transform: 'translate(-20px, 20px) scale(0.9)' },
                '100%': { transform: 'translate(0px, 0px) scale(1)' },
              },
              float: {
                '0%, 100%': { transform: 'translateY(0)' },
                '50%': { transform: 'translateY(-20px)' },
              }
            }
          }
        }
      }
    </script>
    <style>
      html {
        scroll-behavior: smooth;
        scroll-padding-top: 80px; /* Offset for fixed navbar */
      }
      body {
        background-color: #050508;
        color: #E0DEEE;
        overflow-x: hidden;
      }
      /* Custom Scrollbar */
      ::-webkit-scrollbar {
        width: 8px;
      }
      ::-webkit-scrollbar-track {
        background: #0B0A14;
      }
      ::-webkit-scrollbar-thumb {
        background: #2D274B;
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #9787F4;
      }
      .glass-card {
        background: rgba(45, 39, 75, 0.3);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border: 1px solid rgba(151, 135, 244, 0.1);
      }
      /* Optimization for Mobile: Reduce blur strength */
      @media (max-width: 768px) {
        .glass-card {
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
        }
      }
    </style>
